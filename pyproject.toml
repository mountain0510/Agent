[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-planner-agent"
version = "0.1.0"
description = "A minimal adversarial-aware planning-layer agent for local CTF flag finding."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CTF Planner Agent" }]
license = { text = "MIT" }

[project.scripts]
ctf-agent = "ctf_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ctf_agent*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
